<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Token discipline patterns</title>
  <desc id="desc">Five practical patterns for improving signal per token.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101c2f"/>
      <stop offset="100%" stop-color="#172a44"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="70" y="90" fill="#e2e8f0" font-family="Space Grotesk, sans-serif" font-size="48" font-weight="700">Five Patterns of Token Discipline</text>

  <g font-family="Inter, sans-serif" font-size="24" fill="#dbeafe">
    <g transform="translate(70 140)">
      <rect width="1060" height="82" rx="14" fill="#15263e" stroke="#2e4a6f"/>
      <text x="24" y="50">1. One-line goal first, then details.</text>
    </g>
    <g transform="translate(70 240)">
      <rect width="1060" height="82" rx="14" fill="#15263e" stroke="#2e4a6f"/>
      <text x="24" y="50">2. Add constraints, not filler.</text>
    </g>
    <g transform="translate(70 340)">
      <rect width="1060" height="82" rx="14" fill="#15263e" stroke="#2e4a6f"/>
      <text x="24" y="50">3. Reference artifacts instead of pasting everything.</text>
    </g>
    <g transform="translate(70 440)">
      <rect width="1060" height="82" rx="14" fill="#15263e" stroke="#2e4a6f"/>
      <text x="24" y="50">4. Ask for structured outputs.</text>
    </g>
    <g transform="translate(70 540)">
      <rect width="1060" height="82" rx="14" fill="#15263e" stroke="#2e4a6f"/>
      <text x="24" y="50">5. Iterate in short loops.</text>
    </g>
  </g>
</svg>
