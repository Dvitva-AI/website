<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dvitva.ai Blog Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0F1B2D;
  --navy-light: #162032;
  --teal: #0891B2;
  --white: #FFFFFF;
  --slate: #94A3B8;
  --text: #D6E0EC;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  color: var(--white);
  background: radial-gradient(circle at top right, rgba(8,145,178,0.12), transparent 35%), var(--navy);
}
.container { width: min(960px, 92vw); margin: 0 auto; }
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.2rem 0;
}
.brand {
  text-decoration: none;
  color: var(--white);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.3rem;
  font-weight: 700;
}
.brand span { color: var(--teal); }
.topbar a.link {
  color: var(--slate);
  text-decoration: none;
  font-size: 0.95rem;
}
header {
  padding: 1.4rem 0 1.2rem;
}
header h1 {
  margin: 0;
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(1.8rem, 3.4vw, 2.8rem);
  line-height: 1.2;
}
.meta {
  margin-top: 0.6rem;
  color: var(--slate);
  font-size: 0.92rem;
}
main {
  background: rgba(22,32,50,0.92);
  border: 1px solid rgba(125,211,252,0.18);
  border-radius: 16px;
  padding: 1.4rem 1.2rem;
  margin-bottom: 3rem;
}
article {
  color: var(--text);
  line-height: 1.72;
  font-size: 1.02rem;
}
article h1,
article h2,
article h3 {
  color: var(--white);
  font-family: 'Space Grotesk', sans-serif;
  line-height: 1.3;
  margin-top: 1.6rem;
  margin-bottom: 0.6rem;
}
article h1 { font-size: 1.9rem; }
article h2 { font-size: 1.45rem; }
article h3 { font-size: 1.2rem; }
article p, article li { margin: 0.7rem 0; }
article ul, article ol { padding-left: 1.3rem; }
article code {
  background: rgba(148,163,184,0.2);
  padding: 0.1rem 0.35rem;
  border-radius: 6px;
  color: #E2E8F0;
}
.post-image {
  margin: 1.2rem 0;
}
.post-image img {
  width: 100%;
  display: block;
  border-radius: 12px;
  background: #fff;
  padding: 0.45rem;
}
.post-image figcaption {
  color: var(--slate);
  font-size: 0.85rem;
  margin-top: 0.5rem;
}
.post-image.is-right,
.post-image.is-left {
  width: min(360px, 100%);
}
.post-image.is-right { float: right; margin: 0.4rem 0 1rem 1.2rem; }
.post-image.is-left { float: left; margin: 0.4rem 1.2rem 1rem 0; }
.post-image.is-full { width: 100%; }
article::after { content: ''; display: block; clear: both; }
.layout-feature article {
  font-size: 1.07rem;
}
.layout-feature article h2 { margin-top: 1.8rem; }
.error {
  color: #FCA5A5;
  border: 1px solid rgba(252,165,165,0.45);
  border-radius: 12px;
  padding: 1rem;
}
@media (max-width: 760px) {
  main { padding: 1rem; }
  .post-image.is-right,
  .post-image.is-left {
    float: none;
    margin: 1rem 0;
    width: 100%;
  }
}
</style>
</head>
<body>
  <div class="container">
    <nav class="topbar">
      <a class="brand" href="../index.html">Dvitva<span>.ai</span></a>
      <a class="link" href="./index.html">← Back to Blog</a>
    </nav>

    <header>
      <h1 id="postTitle">Loading...</h1>
      <div class="meta" id="postMeta"></div>
    </header>

    <main id="contentRoot">
      <article id="postBody"></article>
    </main>
  </div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
function formatDate(iso) {
  const date = new Date(iso + 'T00:00:00');
  if (Number.isNaN(date.getTime())) return iso;
  return date.toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });
}

function getSlug() {
  const params = new URLSearchParams(window.location.search);
  return params.get('slug') || '';
}

function applyImageLayouts(root) {
  const paragraphs = Array.from(root.querySelectorAll('p'));
  paragraphs.forEach((p) => {
    if (p.children.length !== 1 || p.children[0].tagName !== 'IMG') return;

    const img = p.children[0];
    const rawAlt = img.getAttribute('alt') || '';
    const parts = rawAlt.split('|').map((s) => s.trim()).filter(Boolean);
    const caption = parts[0] || '';
    const modifiers = new Set(parts.slice(1).map((s) => s.toLowerCase()));

    if (caption) img.setAttribute('alt', caption);

    const figure = document.createElement('figure');
    figure.className = 'post-image';
    if (modifiers.has('full')) figure.classList.add('is-full');
    if (modifiers.has('right')) figure.classList.add('is-right');
    if (modifiers.has('left')) figure.classList.add('is-left');

    figure.appendChild(img);
    if (caption) {
      const figcaption = document.createElement('figcaption');
      figcaption.textContent = caption;
      figure.appendChild(figcaption);
    }

    p.replaceWith(figure);
  });
}

function showError(message) {
  document.getElementById('postTitle').textContent = 'Post unavailable';
  document.getElementById('postMeta').textContent = '';
  document.getElementById('contentRoot').innerHTML = `<div class="error">${message}</div>`;
}

Promise.all([
  fetch('./posts.json').then((r) => {
    if (!r.ok) throw new Error('Failed to load post index.');
    return r.json();
  })
]).then(([posts]) => {
  const slug = getSlug();
  if (!slug) {
    showError('No post selected. Open a post from the blog index.');
    return;
  }

  const post = posts.find((p) => p.slug === slug);
  if (!post) {
    showError(`Post not found for slug: ${slug}`);
    return;
  }

  document.title = `${post.title} | Dvitva.ai Blog`;
  document.getElementById('postTitle').textContent = post.title;
  document.getElementById('postMeta').textContent = formatDate(post.date || '');

  const root = document.getElementById('contentRoot');
  root.classList.remove('layout-feature', 'layout-standard');
  root.classList.add(`layout-${post.layout || 'standard'}`);

  fetch(`./posts/${post.slug}.md`)
    .then((r) => {
      if (!r.ok) throw new Error('Could not load markdown file.');
      return r.text();
    })
    .then((markdown) => {
      const html = marked.parse(markdown, { gfm: true, breaks: false });
      const body = document.getElementById('postBody');
      body.innerHTML = html;
      applyImageLayouts(body);
    })
    .catch((err) => showError(err.message));
}).catch((err) => showError(err.message));
</script>
</body>
</html>
